<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Video Downloader for Stripchat</title>
    <style id="serp-auth-boot-css">#activationSection{display:none !important;} #activationSection[data-serp-auth-ui="1"]{display:block !important;}</style>
    <script src="site-config.js"></script>
    <script src="logger.js"></script>
    <script type="module" src="auth.js"></script>
    <link rel="stylesheet" href="./styles/styles.css">
    <link rel="stylesheet" href="./styles/popup-enhanced.css">
  </head>
  <body>
    <div class="container">
      <div id="quickHelpBanner" class="quick-help-banner hidden" role="status" aria-live="polite">
        <div class="quick-help-heading">How to download:</div>
        <div class="quick-help-text">
          Open a Stripchat model page while the stream is live, then open this popup or click Download on the player.
        </div>
      </div>

      <div class="header">
        <h1>Video Downloader for Stripchat</h1>
        <div class="header-right">
          <button id="quickHelpBtn" class="help-btn" title="Quick help" aria-label="Quick help">?</button>
        </div>
      </div>

      <div id="activationSection" class="activation-section"></div>

      <div id="mainContent" class="main-content hidden">
        <div id="loading" class="loading">
          <div class="spinner"></div>
          <p>Detecting video...</p>
        </div>

        <div id="error" class="error hidden">
          <p class="error-message"></p>
        </div>

        <div id="video-info" class="video-info hidden">
          <div class="video-card">
            <div class="video-thumbnail-container">
              <img id="thumbnail" class="video-thumbnail-image" src="" alt="Video thumbnail">
              <div class="thumbnail-placeholder" id="thumbnail-placeholder">
                <div class="placeholder-content">
                  <div class="placeholder-icon">&#x1F3AC;</div>
                  <div class="placeholder-text">No preview yet</div>
                </div>
              </div>
              <div class="video-duration-badge" id="duration-badge"></div>
            </div>

            <div class="video-details">
              <h2 id="video-title"></h2>
              <div class="video-meta">
                <span id="video-duration" class="duration"></span>
                <span id="vr-badge" class="vr-badge hidden">VR</span>
              </div>
            </div>

            <div class="download-section">
              <h3 id="quality-label">Select Quality:</h3>
              <select id="quality-select" class="quality-select">
                <option value="">Loading formats...</option>
              </select>
              <div id="capture-hint" class="capture-hint hidden"></div>
              <div id="live-capture-status" class="live-capture-status hidden"></div>
            </div>
          </div>
        </div>

        <button id="download-btn" class="download-btn" disabled>
          <span class="btn-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
            </svg>
          </span>
          <span class="btn-text">Download Video</span>
        </button>

        <div id="download-progress" class="download-progress hidden">
          <div class="progress-bar">
            <div class="progress-fill"></div>
          </div>
          <div class="progress-text">Preparing download...</div>
        </div>
      </div>
    </div>
    <script defer src="popup.js"></script>
    <script defer src="auth-ui.js"></script>
    <script defer src="trial-banner.js"></script>
    <script defer src="update-notifier.js"></script>
  </body>
</html>
